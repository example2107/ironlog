name: Supabase keepalive

# Supabase pauses free-tier projects after 7 days without database activity.
# This workflow queries the database daily to keep it awake.
#
# GitHub disables scheduled workflows after 60 days without new commits, so the
# second step writes a timestamp and commits it when the repo has been quiet.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_KEY secret is missing"
            exit 1
          fi

          host=$(echo "${SUPABASE_URL#*://}" | cut -d/ -f1)
          body="$RUNNER_TEMP/response.json"

          # Runners hit occasional DNS/network blips, so retry before crying wolf.
          for attempt in 1 2 3; do
            status=$(curl -sS -o "$body" -w "%{http_code}" \
              --connect-timeout 15 --max-time 45 \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY" \
              "${SUPABASE_URL%/}/rest/v1/exercises?select=*&limit=1") && curl_rc=0 || curl_rc=$?

            [ "$curl_rc" = "0" ] && break
            echo "Attempt $attempt failed (curl exit $curl_rc)"
            [ "$attempt" != "3" ] && sleep 15
          done

          if [ "$curl_rc" != "0" ]; then
            case "$curl_rc" in
              6)  echo "::error::DNS lookup for $host failed on all attempts. The subdomain is gone, which means the Supabase project is paused or deleted — check https://supabase.com/dashboard" ;;
              7)  echo "::error::Connection to $host refused — the Supabase project is likely down" ;;
              28) echo "::error::Request to $host timed out" ;;
              *)  echo "::error::curl failed with exit code $curl_rc" ;;
            esac
            exit 1
          fi

          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            echo "Response body:"
            cat "$body"
            echo
            echo "::error::Supabase returned $status instead of 200"
            exit 1
          fi

      - name: Commit if the repo has been quiet
        run: |
          days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Days since last commit: $days"

          if [ "$days" -lt 45 ]; then
            echo "Recent enough, nothing to do."
            exit 0
          fi

          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "chore: keep scheduled workflows enabled"
          git push origin HEAD:main
